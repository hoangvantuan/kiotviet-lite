server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload file (import Excel) có thể vượt mặc định 1m
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # IP client thật (BM-01). cloudflared trên host tới nginx qua cổng 127.0.0.1 nên nguồn luôn
    # là địa chỉ nội bộ; chỉ nguồn nội bộ mới được đặt IP qua CF-Connecting-IP (Cloudflare ghi đè,
    # client không giả được). Không có header này thì giữ nguyên địa chỉ kết nối.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # GHI ĐÈ X-Forwarded-For do client gửi, không nối thêm: API (TRUSTED_PROXY_HOPS=1)
        # chỉ tin đúng một địa chỉ do nginx đặt.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker không được cache để PWA cập nhật ngay
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Asset có hash trong tên file: cache dài hạn
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
