# Tệp này được include trong khối http của nginx (conf.d/default.conf) nên dùng được map.
#
# GL-20: tệp không có hash trong tên (index.html, sw.js, sw-cleanup.js, manifest) phải hỏi
# lại máy chủ mỗi lần, nếu không trình duyệt giữ bản cũ theo heuristic sau khi triển khai.
# Asset trong /assets/ có hash nên cache dài hạn.
map $uri $kvl_cache_control {
    default    "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload file (import Excel) có thể vượt mặc định 1m
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # IP client thật (BM-01). cloudflared trên host tới nginx qua cổng 127.0.0.1 nên nguồn luôn
    # là địa chỉ nội bộ; chỉ nguồn nội bộ mới được đặt IP qua CF-Connecting-IP (Cloudflare ghi đè,
    # client không giả được). Không có header này thì giữ nguyên địa chỉ kết nối.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # API tự đặt Cache-Control: private, no-store và header bảo mật
    # (apps/api/src/middleware/security-headers.middleware.ts), nginx không thêm để khỏi trùng.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # GHI ĐÈ X-Forwarded-For do client gửi, không nối thêm: API (TRUSTED_PROXY_HOPS=1)
        # chỉ tin đúng một địa chỉ do nginx đặt.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # R4 (KHO-08): thời gian chờ đặt rõ thay vì dựa vào mặc định 60s. Hết giờ thì nginx trả
        # 504 trong khi API có thể vẫn đang lưu; web coi 502/504/524 với request ghi là "chưa rõ
        # đã lưu hay chưa" và gửi lại cùng Idempotency-Key. Đọc phản hồi 90s: dưới ngưỡng 100s
        # của Cloudflare (lỗi 524) để người dùng nhận lỗi của nginx trước. Kết nối 5s: api cùng
        # mạng Docker, quá 5s là api không chạy. Xem docs/deploy.md mục 3.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;
    }

    location / {
        # BM-103: header bảo mật cho SPA. add_header không kế thừa từ khối cha khi khối con có
        # add_header riêng, nên mọi header của phần web đặt tại đây và location con không đặt thêm.
        #
        # CSP theo đúng những gì bản build dùng:
        # - script-src 'wasm-unsafe-eval': PGlite biên dịch WebAssembly (không mở eval JS).
        # - style-src 'unsafe-inline': thuộc tính style do React, Radix, Recharts gắn vào phần tử.
        # - img-src https:: ảnh sản phẩm là URL ngoài do người dùng nhập.
        # - worker-src blob:: PGlite và html5-qrcode có thể tạo worker từ blob.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        # Không dùng always: không để trình duyệt cache dài hạn một phản hồi 404
        add_header Cache-Control $kvl_cache_control;

        # Asset có hash: thiếu thì trả 404, không rơi về index.html
        location /assets/ {
            try_files $uri =404;
        }

        # SPA fallback
        try_files $uri /index.html;
    }
}
