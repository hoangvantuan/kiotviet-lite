name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm -r build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: ci
    # Cho phép thất bại mềm trong lần đầu (mới chỉ có test khói), sẽ siết lại khi bộ E2E hoàn thiện và ổn định
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiotviet
          POSTGRES_PASSWORD: kiotviet_password
          POSTGRES_DB: kiotviet_lite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://kiotviet:kiotviet_password@localhost:5432/kiotviet_lite_test
      JWT_SECRET: supersecret-jwt-key-must-be-at-least-32-chars-long
      PORT: 3000
      VITE_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @kiotviet-lite/web exec playwright install --with-deps chromium

      - name: Migrate Database Schema
        run: pnpm db:migrate

      - name: Seed Database
        run: pnpm --filter @kiotviet-lite/api run db:seed

      - name: Build Web
        run: pnpm --filter @kiotviet-lite/web run build

      - name: Start API Server
        run: |
          pnpm --filter @kiotviet-lite/api run dev &
          sleep 5

      - name: Run Playwright E2E Tests
        run: pnpm --filter @kiotviet-lite/web run test:e2e

      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
