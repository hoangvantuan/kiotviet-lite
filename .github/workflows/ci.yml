name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Bình thường khoảng 20 phút; test treo thì hỏng sớm thay vì giữ runner 6 giờ
    timeout-minutes: 45
    # Postgres thật cho các test cần nhiều kết nối đồng thời (PGlite chỉ có một kết nối),
    # ví dụ test deadlock phiếu thu và trả hàng (TIEN-103)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kiotviet
          POSTGRES_PASSWORD: kiotviet_password
          POSTGRES_DB: kiotviet_lite_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test
        env:
          TEST_PG_URL: postgres://kiotviet:kiotviet_password@localhost:5432/kiotviet_lite_ci

      - name: Build
        run: pnpm -r build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    services:
      postgres:
        # Cùng bản với production (docker-compose.prod.yml)
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kiotviet
          POSTGRES_PASSWORD: kiotviet_password
          POSTGRES_DB: kiotviet_lite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://kiotviet:kiotviet_password@localhost:5432/kiotviet_lite_test
      JWT_ACCESS_SECRET: e2e-test-jwt-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: e2e-test-jwt-refresh-secret-at-least-32-chars
      PORT: 3000
      VITE_API_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:5173
      # Bộ E2E đăng nhập nhiều lần liên tiếp từ cùng một IP, vượt ngưỡng 5 lần/phút
      RATE_LIMIT_DISABLED: 'true'
      BULK_IMPORT_DIR: /tmp/kiotviet-lite-e2e-imports
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @kiotviet-lite/web exec playwright install --with-deps chromium

      - name: Migrate Database Schema
        run: pnpm db:migrate

      - name: Seed Database
        id: seed
        run: pnpm --filter @kiotviet-lite/api run db:seed

      - name: Prepare Bulk Import Storage
        run: mkdir -p "$BULK_IMPORT_DIR"

      - name: Start API Server and Wait for Ready
        run: |
          pnpm --filter @kiotviet-lite/api run dev &
          echo "Waiting for API server to become ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then
              echo "API server is ready at http://localhost:3000 after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Error: API server failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

      # Đích dev: vite dev, không có service worker
      - name: Run Playwright E2E Tests (vite dev)
        run: pnpm --filter @kiotviet-lite/web run test:e2e

      # Dữ liệu sau E2E phải thỏa bất biến công nợ, tồn kho, phân bổ phiếu thu, công nợ NCC.
      # Chạy cả khi E2E lỗi để biết lỗi giao diện có kèm lệch dữ liệu hay không.
      - name: Check Data Invariants (after vite dev E2E)
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: |
          command -v psql > /dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f apps/api/scripts/invariants.sql

      # Các bài ghi dữ liệu thật (bán nợ, trả hàng...), nên đích prod cần DB seed lại từ đầu
      - name: Reseed Database for Production Build E2E
        id: reseed
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: FORCE_SEED=1 pnpm --filter @kiotviet-lite/api run db:seed

      # Đích prod: bản build production có service worker, e2e/prod-server.mjs mô phỏng
      # deploy/nginx.conf (/api/ proxy sang API, SPA fallback). Playwright tự build và khởi động.
      - name: Run Playwright E2E Tests (production build with service worker)
        if: ${{ !cancelled() && steps.reseed.outcome == 'success' }}
        run: pnpm --filter @kiotviet-lite/web run test:e2e:prod

      - name: Check Data Invariants (after production build E2E)
        if: ${{ !cancelled() && steps.reseed.outcome == 'success' }}
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f apps/api/scripts/invariants.sql

      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
