packages:
  - 'apps/*'
  - 'packages/*'

# @hookform/resolvers không khai báo zod là dependency/peerDependency, nên pnpm
# không link zod vào thư mục của nó và bundler không resolve được `zod/v4/core`.
packageExtensions:
  '@hookform/resolvers':
    peerDependencies:
      zod: '*'
    peerDependenciesMeta:
      zod:
        optional: true

# PGliteWorker 0.4.4 (còn nguyên ở 0.5.8): tab đóng khi yêu cầu giành khóa truy vấn còn đang xếp hàng
# thì worker chủ giành được khóa sau đó và giữ mãi, mọi tab khác treo truy vấn. Bản vá nhả khóa ngay
# nếu tab đã đóng và không trả lời vào kênh đã đóng.
patchedDependencies:
  '@electric-sql/pglite@0.4.4': patches/@electric-sql__pglite@0.4.4.patch
